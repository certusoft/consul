# Build an upstream Consul release for illumos (SmartOS / Triton) and publish
# it as a GitHub Release in this fork.
#
# HashiCorp only ships a GOOS=solaris build. Go's syscall package uses Oracle
# Solaris's F_DUP2FD_CLOEXEC (0x30) in that build; on illumos 0x30 is
# F_OFD_SETLK, so fork/exec intermittently fails with "bad address" (EFAULT).
# A GOOS=illumos build uses the illumos value (0x24).
#
# Trigger: push a tag named v<version>-illumos, e.g.
#   git tag v2.0.4-illumos origin/certusoft/illumos-build
#   git push origin v2.0.4-illumos
# The source is hashicorp/consul at tag v<version>; the build uses the same
# flags and version stamps as HashiCorp's release workflow (build.yml).

name: illumos release

on:
  push:
    tags:
      - "v*-illumos"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          ver="${ver%-illumos}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Building Consul ${ver} for illumos from hashicorp/consul v${ver}"

      - name: Check out hashicorp/consul
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: hashicorp/consul
          ref: v${{ steps.v.outputs.version }}
          path: src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GOOS: illumos
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          test "$(tr -d '[:space:]' < version/VERSION)" = "${VERSION}"
          commit=$(git rev-parse --short=8 HEAD)
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          T=github.com/hashicorp/consul/version
          go build -trimpath -buildvcs=false \
            -ldflags "-X ${T}.GitCommit=${commit} -X ${T}.GitDescribe=${VERSION} -X ${T}.BuildDate=${date}" \
            -o ../dist/consul .
          go version -m ../dist/consul | grep -E "^\s+build\s+GOOS=illumos$"

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cp src/LICENSE dist/LICENSE
          cd dist
          zip -j "consul_${VERSION}_illumos_amd64.zip" consul LICENSE
          sha256sum "consul_${VERSION}_illumos_amd64.zip" > "consul_${VERSION}_SHA256SUMS"
          cat "consul_${VERSION}_SHA256SUMS"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Consul ${VERSION} for illumos" \
            --notes "Consul ${VERSION} built from hashicorp/consul v${VERSION} with GOOS=illumos (Go version from go.mod, CGO_ENABLED=0, HashiCorp release flags). Consul is licensed under the Business Source License 1.1; see LICENSE in the zip." \
            "dist/consul_${VERSION}_illumos_amd64.zip" \
            "dist/consul_${VERSION}_SHA256SUMS"
